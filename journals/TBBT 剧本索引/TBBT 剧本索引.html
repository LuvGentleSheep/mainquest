<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBBT 剧本索引</title>
    <meta name="description" content="The Big Bang Theory Transcript Link Index">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f5;
            --text: #1a1a1a;
            --card: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
            --muted: #5f5f5f;
            --accent: #111;
            --code-bg: rgba(0, 0, 0, 0.05);
            --code-text: #c7254e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #050505;
                --text: #f5f5f5;
                --card: rgba(8, 8, 8, 0.85);
                --border: rgba(255, 255, 255, 0.12);
                --muted: #c7c7c7;
                --accent: #fff;
                --code-bg: rgba(255, 255, 255, 0.08);
                --code-text: #ffb4b4;
            }
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, rgba(255,255,255,0.15), transparent), var(--bg);
            padding: 32px 16px 64px;
        }
        .page-shell {
            max-width: 920px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0,0,0,0.08);
            overflow: hidden;
            backdrop-filter: blur(16px);
        }
        .entry-header {
            padding: 32px;
            border-bottom: 1px solid var(--border);
        }
        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .title-row {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .entry-header h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.2;
        }
        .meta {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
        }
        .hero {
            position: relative;
            padding: 0 32px 32px;
        }
        .hero img {
            width: 100%;
            border-radius: 18px;
            display: block;
            object-fit: cover;
            max-height: 420px;
        }
        .markdown-body {
            padding: 0 32px 48px;
            font-size: 16px;
            line-height: 1.8;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin-top: 2.5em;
            margin-bottom: 0.8em;
            line-height: 1.3;
        }
        .markdown-body p {
            margin: 0 0 1.2em;
        }
        .markdown-body a {
            color: var(--accent);
            text-decoration: underline;
        }
        .markdown-body blockquote {
            margin: 1.5em 0;
            padding: 1em 1.2em;
            border-left: 3px solid var(--accent);
            background: rgba(0,0,0,0.03);
            border-radius: 0 12px 12px 0;
        }
        .markdown-body pre {
            background: var(--code-bg);
            border-radius: 14px;
            padding: 16px;
            overflow: auto;
            font-size: 14px;
        }
        .markdown-body code {
            background: var(--code-bg);
            color: var(--code-text);
            padding: 2px 6px;
            border-radius: 6px;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1.5em;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border);
            padding: 12px;
            text-align: left;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin: 1em 0;
        }
        .markdown-body figure.md-figure {
            margin: 2.5em auto;
            text-align: center;
        }
        .markdown-body figure.md-figure img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            border: 1px solid var(--border);
        }
        .markdown-body figure.md-figure figcaption {
            margin-top: 0.8em;
            font-size: 0.95em;
            color: var(--muted);
        }
        .markdown-body ul {
            margin: 0 0 1.2em;
            padding-left: 1.5em;
        }
        .markdown-body .flat-entry {
            margin: 0 0 1.2em;
        }
        .markdown-body .flat-entry:last-child {
            margin-bottom: 0;
        }
        .intro-section {
            margin-bottom: 2em;
        }
        .season-nav {
            margin: 2em 0 2.5em;
            padding: 20px 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.02);
        }
        .season-nav-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .season-nav-header h2 {
            margin: 0;
            font-size: 18px;
        }
        .season-nav-actions {
            display: flex;
            gap: 8px;
        }
        .season-nav-actions button {
            font: inherit;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .season-nav-actions button:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.15);
        }
        @media (prefers-color-scheme: dark) {
            .season-nav {
                background: rgba(255, 255, 255, 0.03);
            }
            .season-nav-actions button:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.2);
            }
        }
        .season-nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
            gap: 8px;
        }
        .season-nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .season-nav-link:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.15);
            transform: translateY(-1px);
        }
        @media (prefers-color-scheme: dark) {
            .season-nav-link:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.2);
            }
        }
        .season-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .season-block {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.015);
            scroll-margin-top: 24px;
        }
        @media (prefers-color-scheme: dark) {
            .season-block {
                background: rgba(255, 255, 255, 0.02);
            }
        }
        .season-block[open] {
            border-color: rgba(0, 0, 0, 0.14);
        }
        @media (prefers-color-scheme: dark) {
            .season-block[open] {
                border-color: rgba(255, 255, 255, 0.18);
            }
        }
        .season-block summary {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 17px;
            user-select: none;
        }
        .season-block summary::-webkit-details-marker {
            display: none;
        }
        .season-block summary::before {
            content: "▶";
            display: inline-block;
            font-size: 11px;
            color: var(--muted);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .season-block[open] summary::before {
            transform: rotate(90deg);
        }
        .season-block summary:hover {
            background: rgba(0, 0, 0, 0.03);
        }
        @media (prefers-color-scheme: dark) {
            .season-block summary:hover {
                background: rgba(255, 255, 255, 0.04);
            }
        }
        .season-count {
            margin-left: auto;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }
        .season-episodes {
            padding: 4px 18px 16px;
            border-top: 1px solid var(--border);
        }
        .season-episodes .flat-entry {
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
            line-height: 1.6;
        }
        .season-episodes .flat-entry:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .season-episodes .flat-entry a {
            text-decoration: none;
        }
        .season-episodes .flat-entry a:hover {
            text-decoration: underline;
        }
        @media (max-width: 640px) {
            .entry-header,
            .hero,
            .markdown-body {
                padding: 24px;
            }
            .entry-header h1 {
                font-size: 26px;
            }
            .title-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .icon-badge {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }
            .season-nav {
                padding: 16px;
            }
            .season-nav-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .season-nav-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="entry-header">
            <p class="eyebrow">Journal Entry</p>
            <div class="title-row">
                <span class="icon-badge">🏠</span>
                <h1>TBBT 剧本索引</h1>
            </div>
            <p class="meta">最后更新：2026-06-07 06:59:25</p>
        </header>
        <section class="hero">
            <img src="./assets/image_1780786263599_0.png" alt="TBBT 剧本索引 hero" loading="lazy" decoding="async">
        </section>
        <main id="journal-body" class="markdown-body"></main>
    </div>
    <script>
        const MD_FILE = "TBBT 剧本索引.md";
        const IMAGE_MAP = {
  "../assets/image_1780786263599_0.png": "./assets/image_1780786263599_0.png",
  "image_1780786263599_0.png": "./assets/image_1780786263599_0.png"
};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        marked.setOptions({ gfm: true, breaks: true });
        const cleanRef = (src) => src.trim().replace(/^['"]|['"]$/g, "").replace(/\\/g, "/");
        const remapSrc = (src) => {
            const cleaned = cleanRef(src);
            if (IMAGE_MAP[cleaned]) {
                return IMAGE_MAP[cleaned];
            }
            const fileName = cleaned.split(/[\\/]/).pop();
            if (fileName && IMAGE_MAP[fileName]) {
                return IMAGE_MAP[fileName];
            }
            return fileName ? `./assets/${fileName}` : cleaned;
        };
        const escapeHtmlAttr = (value = "") => value
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        const escapeHtml = (value = "") => value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        const stripMetaLines = (md) => md
            .split(/\r?\n/)
            .filter(line => !/^\s*(?:banner|icon)::/i.test(line))
            .filter(line => !/^\s*logseq\.[^:]+::/i.test(line))
            .filter(line => !/^\s*collapsed::\s*true\s*$/i.test(line))
            .join("\n");
        const applyCaptionBlocks = (md) => {
            const pattern = /!\[([^\]]*)\]\(([^)]+)\)\s*\[\[#caption\]\]==([\s\S]*?)==/gi;
            return md.replace(pattern, (_, alt, src, caption) => {
                const resolved = remapSrc(src);
                const safeAlt = escapeHtmlAttr(alt);
                const safeCaption = escapeHtml(caption.trim());
                return `<figure class="md-figure"><img src="${resolved}" alt="${safeAlt}" loading="lazy" decoding="async"><figcaption>${safeCaption}</figcaption></figure>`;
            });
        };
        const normalizeMarkdown = (md) => {
            const withCaptions = applyCaptionBlocks(md);
            const standard = /!\[([^\]]*)\]\(([^)]+)\)/g;
            const embeds = /!\[\[([^\]]+)\]\]/g;
            const step1 = withCaptions.replace(standard, (_, alt, src) => `![${alt}](${remapSrc(src)})`);
            return step1.replace(embeds, (_, src) => `![${src}](${remapSrc(src)})`);
        };
        const flattenTopLevelLists = (container) => {
            const topLists = Array.from(container.children || []).filter(
                node => node.tagName === "UL"
            );
            topLists.forEach(list => {
                const fragment = document.createDocumentFragment();
                Array.from(list.children || []).forEach(li => {
                    if (!(li instanceof HTMLElement)) {
                        return;
                    }
                    const wrapper = document.createElement("div");
                    wrapper.className = "flat-entry";
                    while (li.firstChild) {
                        wrapper.appendChild(li.firstChild);
                    }
                    fragment.appendChild(wrapper);
                });
                list.replaceWith(fragment);
            });
        };
        const parseSeasonNumber = (text = "") => {
            const match = text.match(/Season\s+(\d+)/i);
            return match ? match[1] : null;
        };
        const isSeasonHeaderEntry = (entry) => {
            const h2 = entry.querySelector("h2");
            return Boolean(h2 && parseSeasonNumber(h2.textContent));
        };
        const buildSeasonNav = (seasonGroups) => {
            const nav = document.createElement("nav");
            nav.className = "season-nav";
            nav.setAttribute("aria-label", "按季导航");

            const header = document.createElement("div");
            header.className = "season-nav-header";

            const title = document.createElement("h2");
            title.textContent = "目录";

            const actions = document.createElement("div");
            actions.className = "season-nav-actions";

            const toggleAllBtn = document.createElement("button");
            toggleAllBtn.type = "button";
            toggleAllBtn.textContent = "全部展开";

            actions.append(toggleAllBtn);
            header.append(title, actions);

            const grid = document.createElement("div");
            grid.className = "season-nav-grid";

            seasonGroups.forEach(({ num, title: seasonTitle }) => {
                const link = document.createElement("a");
                link.className = "season-nav-link";
                link.href = `#season-${num}`;
                link.textContent = `S${num}`;
                link.title = seasonTitle;
                link.addEventListener("click", (event) => {
                    event.preventDefault();
                    const block = document.getElementById(`season-${num}`);
                    if (block) {
                        block.open = true;
                        block.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                });
                grid.appendChild(link);
            });

            nav.append(header, grid);

            toggleAllBtn.addEventListener("click", () => {
                const blocks = [
                    ...(nav.closest(".markdown-body")?.querySelectorAll(".season-block") || [])
                ];
                const allOpen = blocks.length > 0 && blocks.every(block => block.open);
                const nextOpen = !allOpen;
                blocks.forEach(block => { block.open = nextOpen; });
                toggleAllBtn.textContent = nextOpen ? "全部收起" : "全部展开";
            });

            return nav;
        };
        const buildSeasonBlock = ({ num, title, entries }) => {
            const details = document.createElement("details");
            details.className = "season-block";
            details.id = `season-${num}`;

            const summary = document.createElement("summary");
            summary.textContent = title;

            const count = document.createElement("span");
            count.className = "season-count";
            count.textContent = `${entries.length} 集`;
            summary.appendChild(count);

            const episodes = document.createElement("div");
            episodes.className = "season-episodes";
            entries.forEach(entry => episodes.appendChild(entry));

            details.append(summary, episodes);
            return details;
        };
        const organizeBySeason = (container) => {
            const flatEntries = Array.from(container.children).filter(
                node => node.classList?.contains("flat-entry")
            );
            if (!flatEntries.length) {
                return;
            }

            const introNodes = [];
            const seasonGroups = [];
            let currentSeason = null;

            flatEntries.forEach(entry => {
                if (isSeasonHeaderEntry(entry)) {
                    const h2 = entry.querySelector("h2");
                    const num = parseSeasonNumber(h2.textContent);
                    currentSeason = {
                        num,
                        title: h2.textContent.trim(),
                        entries: []
                    };
                    seasonGroups.push(currentSeason);
                    return;
                }

                if (currentSeason) {
                    currentSeason.entries.push(entry);
                } else {
                    introNodes.push(entry);
                }
            });

            if (!seasonGroups.length) {
                return;
            }

            const fragment = document.createDocumentFragment();

            if (introNodes.length) {
                const intro = document.createElement("div");
                intro.className = "intro-section";
                introNodes.forEach(node => intro.appendChild(node));
                fragment.appendChild(intro);
            }

            fragment.appendChild(buildSeasonNav(seasonGroups));

            const list = document.createElement("div");
            list.className = "season-list";
            seasonGroups.forEach(group => list.appendChild(buildSeasonBlock(group)));
            fragment.appendChild(list);

            container.replaceChildren(fragment);
        };
        const openSeasonFromHash = () => {
            const hash = window.location.hash;
            if (!hash.startsWith("#season-")) {
                return;
            }
            const block = document.querySelector(hash);
            if (block instanceof HTMLDetailsElement) {
                block.open = true;
            }
        };
        async function renderMarkdown() {
            try {
                const res = await fetch(`./${MD_FILE}?t=${Date.now()}`);
                const raw = await res.text();
                const cleaned = stripMetaLines(raw);
                const htmlContent = marked.parse(normalizeMarkdown(cleaned));
                const container = document.getElementById("journal-body");
                container.innerHTML = htmlContent;
                flattenTopLevelLists(container);
                organizeBySeason(container);
                openSeasonFromHash();
                window.addEventListener("hashchange", openSeasonFromHash);
                container.querySelectorAll("img").forEach(img => {
                    img.loading = "lazy";
                    img.decoding = "async";
                });
            } catch (err) {
                document.getElementById("journal-body").innerHTML = "<p>无法加载 Markdown 内容，请稍后再试。</p>";
                console.error(err);
            }
        }
        renderMarkdown();
    </script>
</body>
</html>
